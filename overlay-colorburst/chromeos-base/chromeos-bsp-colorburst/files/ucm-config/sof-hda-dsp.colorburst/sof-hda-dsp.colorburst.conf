# colorburst fork of adhd's for_all_boards_ucm2/sof-hda-dsp: adds DspName
# "speaker_eq" on the Speaker device in HiFi.conf, so /etc/cras/dsp.ini's
# speaker pipeline applies. Installed as sof-hda-dsp.colorburst (no collision
# with adhd's own sof-hda-dsp): chromeos-config's /audio/main ucm-suffix
# makes CRAS open the suffixed UCM for the internal card only.
Comment "For Cloudready Lenovo X1 Carbon"
SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Default"
}
