; colorburst tier-1 baseline speaker tuning.
;
; Conservative, hardware-agnostic processing for the internal speakers of
; generic x86 laptops (skl_hda_dsp_generic / sof-hda-dsp). Modeled on the
; structure of overlay-grunt careena's dsp.ini, with every number toned
; down: careena's values were measured for one specific chassis; ours must
; be safe on speakers we have never heard.
;
; Pipeline (playback only): source -> eq2 -> drc -> sink.
; Careena runs drc before eq2; we deliberately swap the order so the
; highpass strips sub-bass BEFORE the compressor sees it - otherwise
; inaudible low-frequency energy would pump the gain of the audible bands.
;
; Every section is gated on dsp_name == "speaker_eq", which only the
; internal Speaker node sets (via DspName in our forked UCM). Headphones,
; HDMI and USB audio pass through untouched: CRAS builds no pipeline at
; all when the source/sink plugins are disabled.
;
; Live tuning on the ThinkPad: edit /etc/cras/dsp.ini in place, then run
;   cras_test_client --reload_dsp

[output_source]
library=builtin
label=source
purpose=playback
disable=(not (equal? dsp_name "speaker_eq"))
output_0={src:0}
output_1={src:1}

[output_sink]
library=builtin
label=sink
purpose=playback
disable=(not (equal? dsp_name "speaker_eq"))
input_0={dst:0}
input_1={dst:1}

; --- EQ: 2 biquads per channel ------------------------------------------
; Biquad 0 (both channels): 120 Hz highpass, 12 dB/oct.
;   Small laptop speakers cannot reproduce content below ~150-200 Hz;
;   feeding it to them wastes excursion and amplifier headroom and causes
;   distortion at higher volumes. 120 Hz is deliberately below the typical
;   driver resonance, so on a laptop with better-than-expected woofers we
;   remove almost nothing audible. Q=0 mirrors careena's highpass.
; Biquad 1 (both channels): high-shelf +2 dB at 8 kHz.
;   Mild presence lift; laptop speakers firing down/sideways lose treble
;   off-axis. +2 dB is the ceiling for a blind tuning - small enough that
;   it cannot make an already-bright speaker harsh. (Q is ignored by the
;   highshelf biquad type.)
[eq2]
library=builtin
label=eq2
disable=(not (equal? dsp_name "speaker_eq"))
input_0={src:0}
input_1={src:1}
output_2={mid:0}
output_3={mid:1}
input_4=2         ; ch0 biquad0: type 2 = highpass
input_5=120       ; freq (Hz)
input_6=0         ; Q
input_7=0         ; gain (unused for highpass)
input_8=2         ; ch1 biquad0: highpass
input_9=120       ; freq
input_10=0        ; Q
input_11=0        ; gain
input_12=5        ; ch0 biquad1: type 5 = highshelf
input_13=8000     ; freq (Hz)
input_14=0        ; Q (unused for highshelf)
input_15=2        ; gain (dB) - mild presence lift, +2 dB max by design
input_16=5        ; ch1 biquad1: highshelf
input_17=8000     ; freq
input_18=0        ; Q
input_19=2        ; gain (dB)

; --- 3-band DRC for loudness --------------------------------------------
; Same band split as careena (0 / 200 / 8000 Hz) but much gentler:
;   careena: threshold -24 dB, knee 30, ratio 12, boost 3 (per band)
;   ours:    threshold -20 dB, knee 20, ratio 3,  boost 0/2/2
; Ratio 3:1 with a wide 20 dB soft knee is barely audible as compression;
; it just rounds off peaks so the perceived volume ceiling rises. At full-
; scale input the reduction is at most ~13 dB, so the +2 dB makeup boost
; on the enabled bands can never push the output into clipping.
; Band 0 (< 200 Hz) stays disabled, exactly like careena: the highpass
; already handled the lows, and compressing bass on unknown drivers is
; the easiest way to make a random laptop sound bad.
; Attack 5 ms / release 250 ms: slow enough to avoid distortion on bass
; transients, fast enough to catch peaks. Emphasis filter disabled - it
; is part of Google's speaker-protection tuning flow and only correct
; when matched to measured driver parameters.
[drc]
library=builtin
label=drc
disable=(not (equal? dsp_name "speaker_eq"))
input_0={mid:0}
input_1={mid:1}
output_2={dst:0}
output_3={dst:1}
input_4=1         ; emphasis_disabled
input_5=0         ; band0 f (crossover lower edge, Hz)
input_6=0         ; band0 enable - OFF, pass lows through untouched
input_7=-20       ; band0 threshold (dB)
input_8=20        ; band0 knee (dB)
input_9=3         ; band0 ratio
input_10=0.005    ; band0 attack (s)
input_11=0.25     ; band0 release (s)
input_12=0        ; band0 boost (dB)
input_13=200      ; band1 f - mids, 200 Hz .. 8 kHz
input_14=1        ; band1 enable
input_15=-20      ; band1 threshold (dB)
input_16=20       ; band1 knee (dB)
input_17=3        ; band1 ratio
input_18=0.005    ; band1 attack (s)
input_19=0.25     ; band1 release (s)
input_20=2        ; band1 boost (dB) - modest makeup gain
input_21=8000     ; band2 f - highs, above 8 kHz
input_22=1        ; band2 enable
input_23=-20      ; band2 threshold (dB)
input_24=20       ; band2 knee (dB)
input_25=3        ; band2 ratio
input_26=0.005    ; band2 attack (s)
input_27=0.25     ; band2 release (s)
input_28=2        ; band2 boost (dB)
