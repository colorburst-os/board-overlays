description "mint this installation's opaque device id, once"
author "colorburst"

# What this is: a random UUID that identifies an *installation* of colorburst
# to our own update server, so that a release can be staged (canary first,
# then a percentage wave) and the fleet can be counted honestly. It is not
# derived from any hardware identifier -- not the DMI serial, not a MAC, not
# the flex_id chain -- so it says nothing about the machine it runs on, and a
# powerwash mints a new one because /var/lib is on the stateful partition.
#
# What deliberately gets NO id: USB/live and recovery boots. Someone
# evaluating colorburst from a stick is not a device in the fleet, must not be
# counted as one, and must not be handed an identifier that would follow them
# onto other machines they plug the stick into. update_engine treats a missing
# file as "send no id", so skipping the write here is the whole mechanism.
#
# Runs after the stateful partition is mounted; update_engine starts later
# (system-services), so the file is in place before the first update check.
start on started system-services
task

oom score -100

# NOTE: a `tmpfiles /usr/lib/tmpfiles.d/colorburst.conf` stanza is the usual
# way to create a directory for an upstart job, but it fails here (rc=73,
# "Failed to determine SELinux security context") because /var/lib/colorburst
# has no entry in the SELinux file_contexts, and a failing tmpfiles stanza
# fails the whole job. Giving it its own entry would mean a new type and new
# allow rules for update_engine to read it; created here instead, the
# directory simply inherits cros_var_lib from /var/lib, which update_engine
# can already read (verified on a VM: the id reaches the Omaha request with
# no denial).

script
  id_file=/var/lib/colorburst/device-id

  mkdir -p /var/lib/colorburst  # croslint: disable: tmpfiles.d cannot label this path; see the note above

  # Already minted: nothing to do. This is the common case on every boot
  # after the first. The length test also rejects a file left truncated by a
  # crash mid-write, which would otherwise silently split one installation
  # into two in the fleet counts; such a file is simply minted again.
  if [ "$(wc -c < "${id_file}" 2>/dev/null || echo 0)" -eq 37 ]; then
    exit 0
  fi

  # Removable (USB/live) or recovery boot: stay anonymous. rootdev_removable
  # prefers is_running_from_installer when the board ships it, and otherwise
  # compares the root drive against the fixed destination drive.
  . /usr/share/misc/chromeos-common.sh
  if rootdev_removable; then
    logger -t colorburst-device-id "removable boot: no device id minted"
    exit 0
  fi

  # The kernel's own UUID source: 122 bits of randomness, no hardware input.
  # 36 characters plus the newline is the 37 the check above expects.
  cat /proc/sys/kernel/random/uuid > "${id_file}"
  sync
  logger -t colorburst-device-id "minted device id"
end script
