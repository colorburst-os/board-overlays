description "colorburst boot diagnostics -> stateful (dev images only)"
author "colorburst"

# Diagnostics only; first thing to kill under memory pressure.
oom score -100

# Deliberately the EARLIEST upstart event, in parallel with chromeos_startup:
# this exists to debug boots that never reach boot-services, so it cannot
# depend on boot-services. It waits for the stateful partition itself.
start on startup

script
  set +e
  # Wait (up to 2 min) for chromeos_startup to mount the stateful partition.
  i=0
  while [ $i -lt 120 ]; do
    mountpoint -q /mnt/stateful_partition && break
    i=$((i+1)); sleep 1
  done
  d=/mnt/stateful_partition/cb-diag/boot-$(date +%m%d-%H%M%S)
  mkdir -p "$d"  # croslint: disable: dev-image diagnostic, writes only under stateful
  echo "stateful wait: ${i}s" > "$d/meta.txt"
  i=0
  while [ $i -lt 60 ]; do
    i=$((i+1))
    {
      echo "=== snapshot $i uptime: $(cat /proc/uptime) ==="
      echo "--- upstart jobs ---"
      initctl list 2>&1 | sort
      echo "--- processes ---"
      ps auxww 2>&1 || ps 2>&1
      echo "--- mounts ---"
      cat /proc/mounts 2>&1
      echo "--- drm ---"
      ls -l /dev/dri 2>&1
      echo "--- network ---"
      ip -br addr 2>&1
    } > "$d/snap$i.txt" 2>&1
    dmesg > "$d/dmesg.txt" 2>&1
    cp /var/log/messages "$d/messages.txt" 2>/dev/null  # croslint: disable: dev-image diagnostic
    mkdir -p "$d/ui" "$d/chrome"  # croslint: disable: dev-image diagnostic
    cp /var/log/ui/* "$d/ui/" 2>/dev/null  # croslint: disable: dev-image diagnostic
    cp /var/log/chrome/* "$d/chrome/" 2>/dev/null  # croslint: disable: dev-image diagnostic
    sync
    sleep 5
  done
end script
