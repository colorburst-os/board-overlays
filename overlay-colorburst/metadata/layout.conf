# colorburst board overlay. The board is reven (ChromeOS Flex) plus the
# colorburst identity: reven exists to boot arbitrary x86 laptops, which is
# exactly colorburst's hardware target, so we inherit all of it and keep our
# delta to identity, input methods and the odd missing firmware file.
cache-format = md5-dict
eapis-banned = 0 1 2 3 4 5 6
masters = portage-stable chromiumos eclass-overlay reven
profile-formats = portage-2 profile-default-eapi
profile_eapi_when_unspecified = 5-progress
repo-name = colorburst
thin-manifests = true
use-manifests = strict
